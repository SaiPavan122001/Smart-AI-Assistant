name: CI

on:
  push:
    branches: [main]
  pull_request:

# The product targets Windows (UI Automation), so CI runs on Windows runners.
jobs:
  backend:
    runs-on: windows-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: python -m pip install -e ".[dev]" pgserver
      - run: python -m ruff format --check app tests evals
      - run: python -m ruff check app tests evals
      - run: python -m mypy
      - name: Tests (unit, security, integration incl. PostgreSQL + browser, e2e)
        run: python -m pytest -q
      - name: Evaluation suite (regression thresholds)
        run: python -m evals.run --json eval-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: backend/eval-report.json }

  frontend:
    runs-on: windows-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: windows-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python -m venv backend/.venv
      - run: backend/.venv/Scripts/python.exe -m pip install -e "backend[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env: { PW_CHANNEL: chrome }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: frontend/test-results }
