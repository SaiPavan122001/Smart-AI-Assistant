[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-ai-assistant"
version = "0.1.0"
description = "Permission-controlled, structured-perception computer-use agent for Windows"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "httpx>=0.27",
  "playwright>=1.45",
  "pywinauto>=0.6.8; sys_platform == 'win32'",
  "pyautogui>=0.9.54",
  "psutil>=5.9",
  "pillow>=10",
  "pypdf>=4",
  "send2trash>=1.8",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "browser: requires an installed Playwright Chromium",
  "windows: requires Windows UI Automation",
  "security: adversarial security tests",
  "e2e: end-to-end agent scenarios",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ASYNC", "RUF", "SIM", "C4", "PL"]
ignore = [
  "PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLW0603",
  "S101",   # assert is fine in tests
  "RUF012", "B008", "E501", "S603", "S607", "S311", "PLC0415", "RUF029",
  "PLR0917", "ASYNC240", "ASYNC109", "PLW0108", "PLW2901", "RUF028", "SIM105", "SIM108", "S110", "S112",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B", "ASYNC", "RUF"]
"evals/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["app"]
exclude = ["app/database/migrations"]
warn_unused_ignores = false  # some ignores are platform dependent (Windows-only modules)

[[tool.mypy.overrides]]
module = ["app.tools.desktop.uia"]
disallow_untyped_calls = false
warn_return_any = false
